<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MAXORA — Diagnostic IA Biométrique & Potentiel Masculin</title>
    <meta name="description" content="Révèle ton potentiel maximal sans artifice. Analyse biométrique faciale par IA, score de départ et programme d'action personnalisé sur MAXORA." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#040508" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MAXORA" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Favicon & Icons Officiels Maxora (Emblème Doré) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=maxora" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=maxora" />
    <link rel="alternate icon" href="/favicon.ico?v=maxora" />
    <link rel="apple-touch-icon" href="/assets/maxora_app_icon.png?v=maxora" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Enregistrement du Service Worker PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
